<!-- Sprint 2 - Work Item 5 -->
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerFragment}">
    <title id="pageTitle">Softball League Manager</title>
</head>
<body>
    <header>
        <nav th:replace="~{fragments/navHeader :: navbar}"></nav>
    </header>
    <main class="align-items-center">
        <h1 class="quantico-bold" th:text="#{label.report.history.result}"></h1>
        <h2 th:text="|Games Played by Team ${reportInput.getTeam()}|"></h2>

        <!-- If the message attribute of the model was set by the ReportController, display the message. -->
        <p th:if="${not #strings.isEmpty(message)}" th:text="#{error.message.no.data.found.history}"></p>

        <div class="card-container">
            <div class="card game" th:each="game : ${reportInput.getGames()}">
                <!-- The order of elements here is meant to work with the grid layout. It doesn't have anything to do with which elements are related to each other. -->
                <p class="card-primary corner-1">Opponent</p>
                <p class="card-primary corner-2">Outcome</p>

                <p class="card-value" th:text="${game.getHomeTeam() == reportInput.getTeam() ? game.getRoadTeam() : game.getHomeTeam()}"></p>
                <p class="card-value" th:text="|${(game.getWinningTeam() == reportInput.getTeam() ? 'Win' : 'Loss') + (game.getIsMercyWin() ? ' (Mercy)' : (game.getForfeited() ? ' (Forfeit)' : ''))}|"></p>

                <p class="card-secondary corner-4">Score Differential</p>
                <p class="card-value corner-3" th:text="${game.getWinningTeam() == reportInput.getTeam() ? game.getScoreDifferential() : -game.getScoreDifferential()}"></p>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
