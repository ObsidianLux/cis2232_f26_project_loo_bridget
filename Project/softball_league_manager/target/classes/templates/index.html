<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerFragment}">
    <title id="pageTitle">Softball League Manager</title>
</head>
<body>
<header>
    <nav th:replace="~{fragments/navHeader :: navbar}"></nav>
</header>
<main>
    <hgroup>
        <h1 class="center-align quantico-bold">Team Standings</h1>
        <p class="subtitle">Teams are ordered first by their Win Percentage (PCT), then if there is a tie, by their number of Mercy Wins and Forfeit Wins.</p>
    </hgroup>

    <div class="card-container margin-top-20">
        <div class="card" th:each="team, iterStat : ${teams}">
            <hgroup>
                <h2 th:text="${team.getTeamName()}" class="quantico-bold font-secondary-colour"></h2>
            </hgroup>

            <div class="card-body grid row-2 col-2 row-gap">
                <div class="metric">
                    <p class="metric-label">Games</p>
                    <p class="metric-value" th:text="${team.getNumberOfGamesPlayed()}"></p>
                </div>

                <div class="metric">
                    <p class="metric-label">PCT</p>
                    <p class="metric-value" th:text="${team.getWinPercentageString()}"></p>
                </div>

                <div class="metric">
                    <p class="metric-label font-win">Wins</p>
                    <div class="metric-group">
                        <p class="metric-value" th:text="${team.getWins().total()}"></p>
                        <p class="metric-divider">•</p>
                        <p class="metric-value" th:text="${team.getWins().mercy()}"></p>
                        <p class="metric-divider">•</p>
                        <p class="metric-value" th:text="${team.getWins().forfeit()}"></p>
                    </div>
                </div>

                <div class="metric">
                    <p class="metric-label font-loss">Losses</p>
                    <div class="metric-group">
                        <p class="metric-value" th:text="${team.getLosses().total()}"></p>
                        <p class="metric-divider">•</p>
                        <p class="metric-value" th:text="${team.getLosses().mercy()}"></p>
                        <p class="metric-divider">•</p>
                        <p class="metric-value" th:text="${team.getLosses().forfeit()}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
