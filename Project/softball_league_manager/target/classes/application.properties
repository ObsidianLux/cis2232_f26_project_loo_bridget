# Port configuration
server.port=8080

# Connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/cis2232_softball_league
spring.datasource.username=root
spring.datasource.password=

# Hibernate & JPA optimization
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true

# UI Template configuration
spring.thymeleaf.cache=false

# Keep GraphiQL testing configuration active
spring.graphql.graphiql.enabled=true

# Debugging in the console (only display my own debug logs, otherwise the console gets really busy)
logging.level.root=INFO
logging.level.ca.hccis.softball=DEBUG