<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerFragment}">
    <title id="pageTitle">Softball League Manager</title>
</head>
<body>
<header>
    <nav th:replace="~{fragments/navHeader :: navbar}"></nav>
</header>
<main>
    <h1 class="center-align quantico-bold">Team Standings</h1>
    <div class="card-container">
        <div class="card team" th:each="team : ${teams}">
            <p th:text="${team.teamName}" class="card-primary full-row corners-top"></p>

            <p class="card-secondary half-row">Games Played</p>
            <p class="card-value half-row" th:text="${team.getNumberOfGamesPlayed()}"></p>

            <p class="card-tertiary"># of Wins</p>
            <p class="card-tertiary"># of Mercy Wins</p>
            <p class="card-tertiary"># of Losses</p>
            <p class="card-tertiary"># of Forfeits</p>

            <p class="card-value" th:text="${team.getNumberOfWins()}"></p>
            <p class="card-value" th:text="${team.getNumberOfMercyWins()}"></p>
            <p class="card-value" th:text="${team.getNumberOfLosses()}"></p>
            <p class="card-value" th:text="${team.getNumberOfForfeits()}"></p>

            <p class="card-secondary half-row corner-4">Win Percentage</p>
            <p class="card-value half-row corner-3" th:text="${team.getWinPercentageString()}"></p>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
