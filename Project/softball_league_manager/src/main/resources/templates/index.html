<!DOCTYPE html>

<!-- Enable Thymeleaf -->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: headerFragment(~{::title}, ~{::link}, _)}">
    <!--
     Replaces this head element with the headerFragment fragment in the head.html file.
     Passes the local title and link elements to the head fragment which will inject the title and link elements.
     I've done this because I want to have more control over what the title of a page is and I want to have separate stylesheets for each page while also having a global stylesheet.
     If I didn't have a stylesheet for this page, I could just pass _ instead of ~{::link}.
    -->
    <title th:text="#{application.name}"></title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>
    <header th:replace="~{fragments/nav :: navMenu('index')}">
        <!--
        Replaces this header element with the navMenu fragment in the nav.html file.
        Passes the word 'index' into the fragment so that it assigns the 'active' class to the correct navigation item.
        -->
    </header>

    <main>
        <section id="schedule">
            <div class="section-header">
                <h1 th:text="#{index.heading.title.schedule}" class="primary-heading quantico-bold"></h1>

                <a th:href="@{/game/add}" th:text="#{index.button.game.add}" class="button primary"></a>
            </div>

            <hr>

            <div id="scheduleButtons">
                <button class="button toggle active" id="btnUpcomingGames" data-toggle="scheduleUpcomingGames" th:text="#{index.button.game.upcoming}"></button>
                <button class="button toggle" id="btnPastGames" data-toggle="schedulePastGames" th:text="#{index.button.game.past}"></button>
            </div>

            <div class="section-body">
                <details class="collapsible-section" id="scheduleFilters">
                    <summary class="collapsible-header">
                        <h3 th:text="#{common.label.filter}"></h3>
                        <img class="icon" th:src="@{/images/keyboard_arrow_down.svg}" alt="Keyboard arrow down">
                    </summary>
                    <div class="collapsible-content">

                    </div>
                </details>

                <article class="card-container hidden" id="schedulePastGames">
                    <!-- Create a card for each past game. -->
                    <div class="card-game" th:each="game : ${pastGames}">
                        <!-- TODO Set up past game cards -->
                    </div>
                </article>

                <article class="card-container" id="scheduleUpcomingGames">
                    <!-- Create a card for each upcoming game. -->
                    <div class="card-wide upcoming" th:each="game : ${upcomingGames}">
                        <p class="subtitle colspan-2" th:text="#{common.label.home}"></p>
                        <p class="subtitle colspan-2" th:text="#{common.label.road}"></p>

                        <h2 th:text="${game.getHomeTeam()}"></h2>
                        <p class="colspan-2" th:text="#{common.label.versus}"></p>
                        <h2 th:text="${game.getRoadTeam()}"></h2>

                        <div class="colspan-4">
                            <p class="subtitle" th:text="${game.getDate()}"></p>
                            <span class="tooltip" tabindex="0" th:if="${game.getDate() < session.today}" th:data-tooltip="#{index.warning.upcoming}">
                                <img th:src="@{/images/error.svg}" alt="Error">
                            </span>
                        </div>

                        <a class="button secondary colspan-2" th:href="@{/update(id=${game.getId()})}" th:text="#{common.button.edit}"></a>

                        <!-- Confirm with the user that they want to delete the game before allowing Thymeleaf to redirect to the Controller. -->
                        <a class="button delete colspan-2" th:href="@{/delete(id=${game.getId()})}" th:text="#{common.button.delete}" onclick="return confirm('Are you sure you want to delete this game?');"></a>
                    </div>
                </article>
            </div>
        </section>

        <section>
            <h1 th:text="#{index.heading.title.standings}" class="primary-heading quantico-bold"></h1>
            <hr>

            <!-- TODO: Tooltips -->

            <div class="section-body">
                <details class="collapsible-section" id="standingSort">
                    <summary class="collapsible-header">
                        <h3 th:text="#{common.label.sort}"></h3>
                        <img class="icon" th:src="@{/images/keyboard_arrow_down.svg}" alt="Keyboard arrow down">
                    </summary>
                    <div class="collapsible-content">

                    </div>
                </details>

                <article class="card-container" id="standings">
                    <!--
                    'teams' refers to an attribute that was added to the model by the Controller that mapped to this page.
                    'team' refers to an instance of the Team class in the 'teams' list.
                    -->
                    <div class="card-wide standing" th:each="team, iterStat : ${teams}" th:with="rank=${iterStat.index + 1}">
                        <p class="rank subtitle" th:text="|#{common.label.hash}${rank}|"></p>

                        <p class="pct" th:text="${team.getWinPercentageString()}"></p>
                        <h3 class="team quantico-bold font-secondary-colour" th:text="${team.getTeamName()}"></h3>

                        <!-- The card has 3 'metrics' that I created with inspiration from Streamlit's native metric component. -->
                        <div class="metric games">
                            <p class="metric-label" th:text="#{common.metric.game}"></p>
                            <p class="metric-value" th:text="${team.getNumberOfGamesPlayed()}"></p>
                        </div>

                        <div class="metric wins">
                            <p class="metric-label font-win" th:text="#{common.metric.win}"></p>

                            <!-- Displays the total number of wins, the number of wins via Mercy Rule, and the number of wins by forfeit. -->
                            <div class="metric-group">
                                <p class="metric-value" th:text="${team.getWins().total()}"></p>
                                <p class="metric-divider" th:text="#{common.metric.divider.bullet}"></p>
                                <p class="metric-value" th:text="${team.getWins().mercy()}"></p>
                                <p class="metric-divider" th:text="#{common.metric.divider.bullet}"></p>
                                <p class="metric-value" th:text="${team.getWins().forfeit()}"></p>
                            </div>
                        </div>

                        <div class="metric losses">
                            <p class="metric-label font-loss" th:text="#{common.metric.loss}"></p>

                            <!-- Displays the total number of losses, the number of losses via Mercy Rule, and the number of losses by forfeit. -->
                            <div class="metric-group">
                                <p class="metric-value" th:text="${team.getLosses().total()}"></p>
                                <p class="metric-divider" th:text="#{common.metric.divider.bullet}"></p>
                                <p class="metric-value" th:text="${team.getLosses().mercy()}"></p>
                                <p class="metric-divider" th:text="#{common.metric.divider.bullet}"></p>
                                <p class="metric-value" th:text="${team.getLosses().forfeit()}"></p>
                            </div>
                        </div>

                        <!-- Links to the Team History Report and passes the team name as a parameter to generate the report without having to select the team first. -->
                        <a class="button history" th:href="@{/reports/history/view(teamName=${team.getTeamName()})}">
                            <!--                                <img th:src="@{/images/history.svg}" alt="History icon.">-->
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M12,21q-3.45,0-6.01-2.29Q3.43,16.43 3.05,13H5.1q0.35,2.6 2.31,4.3T12,19q2.93,0 4.96-2.04Q19,14.93 19,12q0-2.93-2.04-4.96T12,5Q10.28,5 8.78,5.8T6.25,8H9v2H3V4H5V6.35q1.28-1.6 3.11-2.47T12,3q1.88,0 3.51,0.71t2.85,1.93t1.93,2.85T21,12t-0.71,3.51t-1.93,2.85t-2.85,1.93T12,21Zm2.8-4.8L11,12.4V7h2v4.6l3.2,3.2l-1.4,1.4Z"/></svg>
                        </a>
                    </div>
                </article>
            </div>
        </section>
