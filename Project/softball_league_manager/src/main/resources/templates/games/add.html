<!DOCTYPE html>

<!-- Enable Thymeleaf -->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: headerFragment(~{::title}, ~{::link}, ~{::script})}">
    <!-- I want to avoid pulling all scripts on the page into the head, so I limit parameter scripts to only those in this head element. -->
    <title th:text="#{application.name}"></title>
    <link rel="stylesheet" th:href="@{/css/add.css}">
    <script th:src="@{/js/add.js}" type="text/javascript" defer></script>

    <!-- Display success message if insert was successful. -->
    <script th:if="${successMessage != null}" th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            const message = /*[[${successMessage}]]*/ 'Insert successful!';

            Toastify({
                text: message,
                duration: 4000,
                close: true,
                gravity: "top",
                position: "right",
                style: {
                    background: "linear-gradient(to right, #00b09b, #96c93d)"
                }
            }).showToast();
        });
    </script>
</head>

<body>
    <header th:replace="~{fragments/nav :: navMenu('add')}">
        <!--
        Replaces this header element with the navMenu fragment in the nav.html file.
        Passes the word 'add' into the fragment so that it assigns the 'active' class to the correct navigation item.
        -->
    </header>

    <main>
        <div>
            <form th:action="@{/game/__${game.id == null ? 'add' : 'update/' + game.id}__/submit}" th:object="${game}" method="post">
                <!-- th:object directly ties the output of this form to the Game object that was attached to the model by the Controller. -->

                <!-- Datalist that is built up from the teamNames attribute on the model. This will be used by the home team and road team inputs. -->
                <datalist id="teamNames">
                    <option th:each="teamName : ${teamNames}" th:value="${teamName}"></option>
                </datalist>

                <div class="colspan-2">
                    <hgroup>
                        <h1 class="primary-heading" th:if="*{id == null}" th:text="#{add.heading.title}"></h1>
                        <h1 class="primary-heading" th:unless="*{id == null}" th:text="#{update.heading.title}"></h1>
                    </hgroup>
                </div>

                <!-- Left Side of the Form -->

                <hgroup>
                    <h2 th:text="#{add.header.basicInfo}"></h2>
                    <p class="subtitle colspan-2" th:text="#{add.heading.subtitle}"></p>
                </hgroup>

                <article id="formBaseInfo">
                    <!--
                    Basic information
                    I used inputs that draw from a datalist so that the user can select an existing team or type the name of a new one since teams aren't explicitly added to the system.
                    Little subtitle at the top to give the user a bit of guidance on how to fill out this part of the form.
                    -->
                    <label for="inputHomeTeam" th:text="#{add.input.label.home}"></label>
                    <input list="teamNames" id="inputHomeTeam" th:field="*{homeTeamName}" th:placeholder="#{add.input.placeholder.team}">
                    <p class="error-message colspan-2" th:if="${#fields.hasErrors('homeTeamName')}" th:errors="*{homeTeamName}"></p>

                    <label for="inputAwayTeam" th:text="#{add.input.label.road}"></label>
                    <input list="teamNames" id="inputAwayTeam" th:field="*{awayTeamName}" th:placeholder="#{add.input.placeholder.team}">
                    <p class="error-message colspan-2" th:if="${#fields.hasErrors('awayTeamName')}" th:errors="*{awayTeamName}"></p>

                    <label for="inputGameDay" th:text="#{add.input.label.date}"></label>
                    <input type="date" id="inputGameDay" th:field="*{gameDay}">
                    <p class="error-message colspan-2" th:if="${#fields.hasErrors('gameDay')}" th:errors="*{gameDay}"></p>
                </article>

                <article id="forfeitSelectContainer">
                    <div>
                        <input type="checkbox" role="switch" id="switchForfeit" th:field="*{forfeited}">
                        <label for="switchForfeit" th:text="#{add.input.label.decision}"></label>
                    </div>

                    <div>
                        <label for="teamAtFault" th:text="#{add.select.label.teamAtFault}"></label>
                        <select th:with="forfeited=${game.forfeited() != null && game.forfeited()}" th:field="*{teamAtFault}" id="teamAtFault" th:disabled="${!forfeited}">
                            <option th:if="${forfeited}" value=""></option>
                            <option th:if="${forfeited}" th:value="*{homeTeamName}" th:selected="${forfeited && game.homeTeamName() == game.teamAtFault()}" th:text="*{homeTeamName}"></option>
                            <option th:if="${forfeited}" th:value="*{awayTeamName}" th:selected="${forfeited && game.awayTeamName() == game.teamAtFault()}" th:text="*{awayTeamName}"></option>
                        </select>
                    </div>

                    <p class="error-message" th:if="${#fields.hasErrors('teamAtFault')}" th:errors="*{teamAtFault}"></p>
                </article>

                <input type="submit" th:value="#{common.button.done}" class="primary-button" id="btnSubmit">

                <!-- Right Side of the Form -->

                <hgroup>
                    <h2 th:text="#{add.header.innings}"></h2>
                    <p class="subtitle" th:text="#{add.subheader.innings}"></p>
                    <p class="error-message" th:if="${#fields.hasErrors('innings')}" th:errors="*{innings}"></p>
                </hgroup>

                <article id="formInnings" class="rowspan-3">
                    <!-- Inning information -->
                    <div id="inningsContainerOuter">
                        <div id="inningTotalsRow">
                            <!-- These elements display the calculated (by JavaScript) total scores for each team. They default to 0. -->
                            <p th:text="#{add.subheader.innings.total.home}"></p>
                            <p id="totalHomeRuns">0</p>
                            <p th:text="#{add.subheader.innings.total.road}"></p>
                            <p id="totalAwayRuns">0</p>
                        </div>
                        <div id="inningsContainerInner">
                            <div class="inning-row" th:each="item, iterStat : *{innings}">
                                <p class="inning-number" data-field="inningNumber" th:text="${iterStat.index + 1}"></p>

                                <label th:for="|innings[${iterStat.index}].homeRuns|" th:text="#{add.input.label.inning.home}"></label>
                                <input type="number" th:id="|innings[${iterStat.index}].homeRuns|" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[__${iterStat.index}__].homeRuns}">

                                <label th:for="|innings[${iterStat.index}].awayRuns|" th:text="#{add.input.label.inning.road}"></label>
                                <input type="number" th:id="|innings[${iterStat.index}].awayRuns|" min="0" step="1" value="0" data-field="awayRuns" th:field="*{innings[__${iterStat.index}__].awayRuns}">

                                <button th:text="#{common.button.remove}" onclick="removeInning(this)" class="remove-button" type="button"></button>
                            </div>
                        </div>
                        <div id="inningRowAdd">
                            <button id="btnAddInning" type="button" th:disabled="*{forfeited}">
                                <!-- This is the add box Material Icon from Google -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M11,17h2V13h4V11H13V7H11v4H7v2h4v4ZM5,21q-0.83,0-1.41-0.59T3,19V5Q3,4.17 3.59,3.59T5,3H19q0.83,0 1.41,0.59T21,5V19q0,0.82-0.59,1.41T19,21H5Zm0-2H19V5H5V19ZM5,5V19V5Z"/></svg>
                            </button>
                        </div>
                    </div>
                </article>


                <template id="templateInningRow">
                    <div class="inning-row">
                        <!-- Need to set the text of this p. -->
                        <p class="inning-number" data-field="inningNumber"></p>

                        <!-- Need to set the id and name for the input, and the label's for. -->
                        <label th:text="#{add.input.label.inning.home}"></label>
                        <input type="number" min="0" step="1" value="0" data-field="homeRuns">

                        <!-- Need to set the id and name for the input, and the label's for. -->
                        <label th:text="#{add.input.label.inning.road}"></label>
                        <input type="number" min="0" step="1" value="0" data-field="awayRuns">

                        <button th:text="#{common.button.remove}" onclick="removeInning(this)" class="remove-button" type="button"></button>
                    </div>
                </template>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
