<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="headerFragment(pageTitle, pageStyle, pageScript)">
    <!-- I've ignored the missing title issue with this head element because the calling html file will provide a title element to inject. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Injects page-specific title -->
    <th:block th:replace="${pageTitle}"></th:block>

    <!-- Styling -->
    <link rel="stylesheet" th:href="@{/css/global.css}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/css/nav.css}" type="text/css"/>
    <!-- Injects page-specific styling -->
    <th:block th:replace="${pageStyle}"></th:block>

    <!-- Local Scripts -->
    <script type="text/javascript" th:src="@{/js/script.js}" defer></script>
    <th:block th:replace="${pageScript}"></th:block>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body></body>
</html>
