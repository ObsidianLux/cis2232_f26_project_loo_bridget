<!-- IntelliJ wouldn't recognize the game object without defining a thymesVar -->
<!--/*@thymesVar id="game" type="ca.hccis.softball.model.dto.GameDTO"*/-->

<!-- TODO Include game id as @RequestParam -->
<form th:fragment="form(teamNames, title, action)" th:action="@{${action}}" th:object="${game}" method="post">
    <!-- th:object directly ties the output of this form to the Game object that was attached to the model by the Controller. -->

    <!-- Datalist that is built up from the teamNames attribute on the model. This will be used by the home team and road team inputs. -->
    <datalist id="teamNames">
        <option th:each="teamName : ${teamNames}" th:value="${teamName}"></option>
    </datalist>

    <hgroup>
        <h1 class="primary-heading" th:text="${title}"></h1>
    </hgroup>

    <section id="formBody">
        <article id="formBaseInfo">
            <!--
            Basic information
            I used inputs that draw from a datalist so that the user can select an existing team or type the name of a new one since teams aren't explicitly added to the system.
            Little subtitle at the top to give the user a bit of guidance on how to fill out this part of the form.
            -->

            <p class="subtitle" th:text="#{add.heading.subtitle}"></p>

            <label for="inputHomeTeam" th:text="#{add.input.label.home}"></label>
            <input list="teamNames" id="inputHomeTeam" th:field="*{homeTeam}" th:placeholder="#{add.input.placeholder.team}">
            <p class="error-message" th:if="${#fields.hasErrors('homeTeam')}" th:errors="*{homeTeam}"></p>

            <label for="inputRoadTeam" th:text="#{add.input.label.road}"></label>
            <input list="teamNames" id="inputRoadTeam" th:field="*{roadTeam}" th:placeholder="#{add.input.placeholder.team}">
            <p class="error-message" th:if="${#fields.hasErrors('roadTeam')}" th:errors="*{roadTeam}"></p>

            <label for="inputGameDay" th:text="#{add.input.label.date}"></label>
            <input type="date" id="inputGameDay" th:field="*{date}">
            <p class="error-message" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>
        </article>

        <article id="forfeitSelectContainer">
            <div>
                <input type="checkbox" role="switch" id="switchForfeit" th:field="*{wasForfeited}" disabled>
                <label for="switchForfeit" th:text="#{add.input.label.decision}"></label>
            </div>

            <div>
                <label for="teamAtFault" th:text="#{add.select.label.teamAtFault}"></label>
                <select th:field="*{teamAtFault}" id="teamAtFault" disabled></select>
            </div>

            <p class="error-message" th:if="${#fields.hasErrors('teamAtFault')}" th:errors="*{teamAtFault}"></p>
        </article>

        <article id="formSubmitButton">
            <input type="submit" th:value="#{common.button.done}" class="primary-button" id="btnSubmit">
        </article>

        <article id="formInnings">
            <!-- Inning information -->
            <hgroup>
                <h2 th:text="#{add.header.innings}"></h2>
                <p class="subtitle" th:text="#{add.subheader.innings}"></p>
                <p class="error-message" th:if="${#fields.hasErrors('innings')}" th:errors="*{innings}"></p>
            </hgroup>

            <div id="inningsContainerOuter">
                <div id="inningsContainerInner" th:with="innings=${#lists.isEmpty(game.innings) ? #numbers.sequence(0, 6) : game.innings}">
                    <div id="inningsMinimum">
                        <div class="inning-row" th:each="item, iterStat : ${innings}" th:if="${iterStat.index < 5}">
                            <p class="inning-number" data-field="inningNumber" th:text="${iterStat.index + 1}"></p>

                            <label th:for="|innings[${iterStat.index}].homeRuns|" th:text="#{add.input.label.inning.home}"></label>
                            <input type="number" th:id="|innings[${iterStat.index}].homeRuns|" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[__${iterStat.index}__].homeRuns}">

                            <label th:for="|innings[${iterStat.index}].roadRuns|" th:text="#{add.input.label.inning.road}"></label>
                            <input type="number" th:id="|innings[${iterStat.index}].roadRuns|" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[__${iterStat.index}__].roadRuns}">
                        </div>
                    </div>
                    <div id="inningsAdditional">
                        <div class="inning-row" th:each="item, iterStat : ${innings}" th:if="${iterStat.index > 4}">
                            <p class="inning-number" data-field="inningNumber" th:text="${iterStat.index + 1}"></p>

                            <label th:for="|innings[${iterStat.index}].homeRuns|" th:text="#{add.input.label.inning.home}"></label>
                            <input type="number" th:id="|innings[${iterStat.index}].homeRuns|" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[__${iterStat.index}__].homeRuns}">

                            <label th:for="|innings[${iterStat.index}].roadRuns|" th:text="#{add.input.label.inning.road}"></label>
                            <input type="number" th:id="|innings[${iterStat.index}].roadRuns|" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[__${iterStat.index}__].roadRuns}">

                            <button th:text="#{common.button.remove}" onclick="removeInning(this)" class="remove-button" type="button"></button>
                        </div>
                    </div>
                </div>
                <div class="inning-row-add">
                    <button id="btnAddInning" type="button">
                        <!-- This is the add box Material Icon from Google -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M11,17h2V13h4V11H13V7H11v4H7v2h4v4ZM5,21q-0.83,0-1.41-0.59T3,19V5Q3,4.17 3.59,3.59T5,3H19q0.83,0 1.41,0.59T21,5V19q0,0.82-0.59,1.41T19,21H5Zm0-2H19V5H5V19ZM5,5V19V5Z"/></svg>
                    </button>
                </div>
            </div>
        </article>
    </section>

    <template id="templateInningRow">
        <div class="inning-row">
            <!-- Need to set the text of this p. -->
            <p class="inning-number" data-field="inningNumber"></p>

            <!-- Need to set the id and name for the input, and the label's for. -->
            <label th:text="#{add.input.label.inning.home}"></label>
            <input type="number" min="0" step="1" value="0" data-field="homeRuns">

            <!-- Need to set the id and name for the input, and the label's for. -->
            <label th:text="#{add.input.label.inning.road}"></label>
            <input type="number" min="0" step="1" value="0" data-field="roadRuns">

            <button th:text="#{common.button.remove}" onclick="removeInning(this)" class="remove-button" type="button"></button>
        </div>
    </template>
</form>
