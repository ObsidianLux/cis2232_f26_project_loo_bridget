<!DOCTYPE html>

<!-- Enable Thymeleaf -->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: headerFragment(~{::title}, _)}">
    <!-- Passing '_' into the fragment means that it will not inject any custom stylesheets. -->
    <title th:text="#{application.name}"></title>
</head>

<body>
    <aside th:replace="~{fragments/navSidebar :: navSidebar('add')}">
        <!--
        Replaces this aside element with the navSidebar fragment in the navSidebar.html file.
        Passes the word 'add' into the fragment so that it assigns the 'active' class to the correct navigation item.
        -->
    </aside>

    <main>
        <h1 th:text="#{add.title}"></h1>
    </main>
</body>
</html>
