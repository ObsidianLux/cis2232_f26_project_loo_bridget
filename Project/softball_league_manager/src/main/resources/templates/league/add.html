<!DOCTYPE html>

<!-- Enable Thymeleaf -->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: headerFragment(~{::title}, ~{::link}, ~{::script})}">
    <title th:text="#{application.name}"></title>
    <link rel="stylesheet" th:href="@{/css/add.css}">
    <script th:src="@{/js/add.js}" type="text/javascript" defer></script>
</head>

<body>
    <aside th:replace="~{fragments/navSidebar :: navSidebar('add')}">
        <!--
        Replaces this aside element with the navSidebar fragment in the navSidebar.html file.
        Passes the word 'add' into the fragment so that it assigns the 'active' class to the correct navigation item.
        -->
    </aside>

    <main>
        <!-- TODO Display success message to user -->
        <!-- th:object directly ties the output of this form to the Game object that was attached to the model by the Controller. -->
        <form method="post" th:action="@{/league/add/submit}" th:object="${game}" id="formAdd">
            <!-- Datalist that is built up from the teamNames attribute on the model. This will be used by the home team and road team inputs. -->
            <datalist id="teamNames">
                <option th:each="teamName : ${teamNames}" th:value="${teamName}"></option>
            </datalist>

            <hgroup>
                <h1 class="primary-heading" th:text="#{add.title}"></h1>
            </hgroup>

            <section id="formBody">
                <article id="formBaseInfo">
                    <!--
                    Basic information
                    I used inputs that draw from a datalist so that the user can select an existing team or type the name of a new one since teams aren't explicitly added to the system.
                    Little subtitle at the top to give the user a bit of guidance on how to fill out this part of the form.
                    -->

                    <p class="subtitle" th:text="#{add.teams.info}"></p>

                    <label for="inputHomeTeam" th:text="#{add.homeTeam.label}"></label>
                    <input list="teamNames" id="inputHomeTeam" th:field="*{homeTeam}" th:placeholder="#{input.combobox.placeholder}">
                    <p class="error-message" th:if="${#fields.hasErrors('homeTeam')}" th:errors="*{homeTeam}"></p>

                    <label for="inputRoadTeam" th:text="#{add.roadTeam.label}"></label>
                    <input list="teamNames" id="inputRoadTeam" th:field="*{roadTeam}" th:placeholder="#{input.combobox.placeholder}">
                    <p class="error-message" th:if="${#fields.hasErrors('roadTeam')}" th:errors="*{roadTeam}"></p>

                    <label for="inputGameDay" th:text="#{add.date.label}"></label>
                    <input type="date" id="inputGameDay" th:field="*{date}">
                    <p class="error-message" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>
                </article>

                <article id="forfeitSelectContainer">
                    <div>
                        <input type="checkbox" role="switch" id="switchForfeit" th:field="*{wasForfeited}" disabled>
                        <label for="switchForfeit" th:text="#{add.decision.label}"></label>
                    </div>

                    <div>
                        <label for="teamAtFault" th:text="#{add.teamAtFault.label}"></label>
                        <select th:field="*{teamAtFault}" id="teamAtFault" disabled></select>
                    </div>

                    <p class="error-message" th:if="${#fields.hasErrors('teamAtFault')}" th:errors="*{teamAtFault}"></p>
                </article>

                <article id="formSubmitButton">
                    <input type="submit" th:value="#{button.done.label}" class="primary-button" id="btnSubmit">
                </article>

                <article id="formInnings">
                    <!-- Inning information -->
                    <hgroup>
                        <h2 th:text="#{add.innings.label}"></h2>
                        <p class="subtitle" th:text="#{add.innings.subtitle}"></p>
                        <p class="error-message" th:if="${#fields.hasErrors('innings')}" th:errors="*{innings}"></p>
                    </hgroup>

                    <div id="inningsContainerOuter">
                        <div id="inningsContainerInner">
                            <div id="inningsMinimum">
                                <div class="inning-row">
                                    <input type="text" class="inning-number" data-field="inningNumber" readonly th:field="*{innings[0].inningNumber}">

                                    <label for="innings[0].homeRuns" th:text="#{add.inning.home}"></label>
                                    <input type="number" id="innings[0].homeRuns" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[0].homeRuns}">

                                    <label for="innings[0].roadRuns" th:text="#{add.inning.road}"></label>
                                    <input type="number" id="innings[0].roadRuns" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[0].roadRuns}">
                                </div>
                                <div class="inning-row">
                                    <input type="text" class="inning-number" data-field="inningNumber" readonly th:field="*{innings[1].inningNumber}">

                                    <label for="innings[1].homeRuns" th:text="#{add.inning.home}"></label>
                                    <input type="number" id="innings[1].homeRuns" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[1].homeRuns}">

                                    <label for="innings[1].roadRuns" th:text="#{add.inning.road}"></label>
                                    <input type="number" id="innings[1].roadRuns" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[1].roadRuns}">
                                </div>
                                <div class="inning-row">
                                    <input type="text" class="inning-number" data-field="inningNumber" readonly th:field="*{innings[2].inningNumber}">

                                    <label for="innings[2].homeRuns" th:text="#{add.inning.home}"></label>
                                    <input type="number" id="innings[2].homeRuns" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[2].homeRuns}">

                                    <label for="innings[2].roadRuns" th:text="#{add.inning.road}"></label>
                                    <input type="number" id="innings[2].roadRuns" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[2].roadRuns}">
                                </div>
                                <div class="inning-row">
                                    <input type="text" class="inning-number" data-field="inningNumber" readonly th:field="*{innings[3].inningNumber}">

                                    <label for="innings[3].homeRuns" th:text="#{add.inning.home}"></label>
                                    <input type="number" id="innings[3].homeRuns" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[3].homeRuns}">

                                    <label for="innings[3].roadRuns" th:text="#{add.inning.road}"></label>
                                    <input type="number" id="innings[3].roadRuns" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[3].roadRuns}">
                                </div>
                                <div class="inning-row">
                                    <input type="text" class="inning-number" data-field="inningNumber" readonly th:field="*{innings[4].inningNumber}">

                                    <label for="innings[4].homeRuns" th:text="#{add.inning.home}"></label>
                                    <input type="number" id="innings[4].homeRuns" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[4].homeRuns}">

                                    <label for="innings[4].roadRuns" th:text="#{add.inning.road}"></label>
                                    <input type="number" id="innings[4].roadRuns" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[4].roadRuns}">
                                </div>
                            </div>
                            <div id="inningsAdditional">
                                <div class="inning-row">
                                    <input type="text" class="inning-number" data-field="inningNumber" readonly th:field="*{innings[5].inningNumber}">

                                    <label for="innings[5].homeRuns" th:text="#{add.inning.home}"></label>
                                    <input type="number" id="innings[5].homeRuns" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[5].homeRuns}">

                                    <label for="innings[5].roadRuns" th:text="#{add.inning.road}"></label>
                                    <input type="number" id="innings[5].roadRuns" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[5].roadRuns}">

                                    <button th:text="#{button.remove.label}" onclick="removeInning(this)" class="remove-button" type="button"></button>
                                </div>
                                <div class="inning-row">
                                    <input type="text" class="inning-number" data-field="inningNumber" readonly th:field="*{innings[6].inningNumber}">

                                    <label for="innings[6].homeRuns" th:text="#{add.inning.home}"></label>
                                    <input type="number" id="innings[6].homeRuns" min="0" step="1" value="0" data-field="homeRuns" th:field="*{innings[6].homeRuns}">

                                    <label for="innings[6].roadRuns" th:text="#{add.inning.road}"></label>
                                    <input type="number" id="innings[6].roadRuns" min="0" step="1" value="0" data-field="roadRuns" th:field="*{innings[6].roadRuns}">

                                    <button th:text="#{button.remove.label}" onclick="removeInning(this)" class="remove-button" type="button"></button>
                                </div>
                            </div>
                        </div>
                        <div class="inning-row-add">
                            <button id="btnAddInning" type="button">
                                <!-- This is the add box Material Icon from Google -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M11,17h2V13h4V11H13V7H11v4H7v2h4v4ZM5,21q-0.83,0-1.41-0.59T3,19V5Q3,4.17 3.59,3.59T5,3H19q0.83,0 1.41,0.59T21,5V19q0,0.82-0.59,1.41T19,21H5Zm0-2H19V5H5V19ZM5,5V19V5Z"/></svg>
                            </button>
                        </div>
                    </div>
                </article>
            </section>
        </form>

        <template id="templateInningRow">
            <div class="inning-row">
                <!-- Need to set the value of this input, and the id and name. -->
                <input type="text" class="inning-number" data-field="inningNumber" readonly>

                <!-- Need to set the id and name for the input, and the label's for. -->
                <label th:text="#{add.inning.home}"></label>
                <input type="number" min="0" step="1" value="0" data-field="homeRuns">

                <!-- Need to set the id and name for the input, and the label's for. -->
                <label th:text="#{add.inning.road}"></label>
                <input type="number" min="0" step="1" value="0" data-field="roadRuns">

                <button th:text="#{button.remove.label}" onclick="removeInning(this)" class="remove-button" type="button"></button>
            </div>
        </template>
    </main>
</body>
</html>
