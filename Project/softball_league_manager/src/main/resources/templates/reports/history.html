<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerFragment}">
    <title id="pageTitle">Softball League Manager</title>
</head>
<body>
<header>
    <nav th:replace="~{fragments/navHeader :: navbar}"></nav>
</header>
<main class="align-items-center">
    <div id="historyHeader">
        <hgroup>
            <h1 class="quantico-bold" th:text="#{history.header}"></h1>
            <p class="subtitle" th:text="#{history.subtitle}"></p>
        </hgroup>

        <form th:action="@{/reports/history/view}" method="post" id="teamHistoryForm">
            <div class="field-horizontal">
                <label for="select-team" th:text="#{history.form.select}"></label>
                <select name="team" id="select-team" th:field="${reportHistory.teamName}">
                    <option th:each="team : ${reportHistory.getTeams()}" th:value="${team.getTeamName()}" th:text="${team.getTeamName()}"></option>
                </select>
            </div>
            <input type="submit" th:value="#{history.form.submit}" class="primary-button">
        </form>
    </div>

    <div th:if="${reportHistory.getTeam() != null and reportHistory.getGames().size() == 0}">
        <p th:text="#{history.result.none}"></p>
    </div>

    <div class="full-width" th:if="${reportHistory.getTeam() != null and reportHistory.getGames().size() > 0}">
        <div class="chart-container">
            <canvas id="historyChart"></canvas>
        </div>

        <script th:if="${reportHistory.getTeam() != null}" th:inline="javascript">
            /**
             * @typedef {Object} HistoryReportData
             * @property {string} teamName
             * @property {string[]} xAxisLabels
             * @property {number[]} teamScoreDataSet
             * @property {number[]} opponentScoreDataSet
             */

            /** @type HistoryReportData */
            const reportData = [[${reportHistory.getHistoryReportData()}]];

            new Chart(document.getElementById("historyChart"), {
                type: "bar",
                data: {
                    labels: reportData.xAxisLabels,
                    datasets: [
                        {
                            label: reportData.teamName,
                            data: reportData.teamScoreDataSet
                        },
                        {
                            label: 'Opponent',
                            data: reportData.opponentScoreDataSet
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: "top"
                        },
                        title: {
                            display: true,
                            text: "Scores by Game"
                        }
                    },
                    scales: {
                        y: {
                            ticks: {
                                precision: 0
                            },
                            title: {
                                display: true,
                                text: "Score"
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: "Game"
                            }
                        }
                    }
                }
            });
        </script>

        <div class="card-container flex row nowrap scrollable">
            <div class="card" th:each="game : ${reportHistory.getGames()}">
                <hgroup>
                    <h2 th:with="isWinner=${game.getWinningTeam() == reportHistory.getTeamName()}" th:text="${isWinner ? #{label.win} : #{label.loss}}" th:classappend="${isWinner ? 'font-win' : 'font-loss'}"></h2>
                    <p class="subtitle small" th:with="exceptional=${game.getWasMercyWin() or game.getWasForfeited()}">
                        <span th:text="${game.getHomeTeam() == reportHistory.getTeam() ? #{label.home} : #{label.road}}"></span>
                        <span th:if="${exceptional}" th:text="#{card.metric.divider.bullet}"></span>
                        <span th:if="${exceptional}" th:text="${game.getWasMercyWin() ? #{label.mercy} : #{label.forfeit}}"></span>
                    </p>
                </hgroup>

                <div class="card-body grid row-2 col-2 row-gap">
                    <div class="metric">
                        <p class="metric-label" th:text="#{card.metric.inning}"></p>
                        <p class="metric-value" th:text="${game.getInnings().size()}"></p>
                    </div>

                    <div class="metric">
                        <p class="metric-label" th:text="#{card.metric.plusMinus}"></p>
                        <p class="metric-value" th:text="${game.getPlusMinus(reportHistory.getTeamName())}"></p>
                    </div>

                    <div class="metric">
                        <p class="metric-label" th:text="#{card.metric.opponent}"></p>
                        <p class="metric-value" th:text="${reportHistory.getOpponentTeamName(game.getHomeTeam(), game.getRoadTeam())}"></p>
                    </div>

                    <div class="metric">
                        <p class="metric-label" th:text="#{card.metric.score}"></p>
                        <div class="metric-group" th:with="homeIsGreater=${game.getHomeScore() > game.getRoadScore()}">
                            <p class="metric-value" th:text="${homeIsGreater ? game.getHomeScore() : game.getRoadScore()}"></p>
                            <p class="metric-divider" th:text="#{card.metric.divider.colon}"></p>
                            <p class="metric-value" th:text="${homeIsGreater ? game.getRoadScore() : game.getHomeScore()}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
