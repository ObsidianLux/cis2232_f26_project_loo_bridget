<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerFragment(~{::title}, _, _)}">
    <!-- Passing '_' into the fragment means that it will not inject any custom stylesheets or scripts. -->
    <title th:text="#{application.name}"></title>
</head>
<body>
<header th:replace="~{fragments/nav :: navMenu(_)}">
    <!--
    Replaces this header element with the navMenu fragment in the nav.html file.
    -->
</header>
<main>
    <h2 th:text="#{label.error}"></h2>
</main>
</body>
</html>
